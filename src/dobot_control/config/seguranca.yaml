# Parâmetros de segurança do movimento do CR10.
#
# Depois de editar, rode o abrir_interface.sh de novo (ele recompila e
# instala este arquivo). Vale para o robô real E para o gêmeo virtual.

# --------------------------------------------------------------------------
# 1. Proteções do PRÓPRIO controlador do Dobot — enviadas toda vez que a
#    interface conecta e habilita o robô (mesmos comandos que o cr10twin usa).
# --------------------------------------------------------------------------
controlador:
  # Detecção de colisão do controlador: 0 = DESLIGADA, 1 a 5 = ligada (quanto
  # maior, mais sensível). O robô sente o impacto pelo esforço dos motores e
  # para. Se este comando falhar, a conexão é RECUSADA.
  nivel_colisao: 3

  # Peso do que está preso na ponta (sensores + suporte) e onde fica o centro
  # de massa dele, medido a partir do flange (mm). A detecção de colisão usa
  # isso: peso errado deixa ela menos confiável.
  # Sensor inercial S02 no invólucro: 0,3 kg, com o centro de massa no centro do
  # invólucro (65,36 x 38,13 x 23,10 mm, centrado no flange -> 11,55 mm para fora).
  carga_kg: 0.3
  centro_massa_mm: [0.0, 0.0, 11.55]

  # Depois de uma colisão: recua esta distância (mm, 0 a 50) e PARA
  # (modo 0 = parar; o cr10twin usa 1 = pausa, que serve para a palpação).
  recuo_colisao_mm: 10.0
  modo_pos_colisao: 0

# --------------------------------------------------------------------------
# 2. Verificação geométrica ANTES de cada movimento.
#    Coordenadas em relação ao ROBÔ: origem no centro da base, na superfície
#    onde ele está parafusado; x para a frente da base, z para cima. Metros.
# --------------------------------------------------------------------------
geometria:
  # Distância mínima entre qualquer parte do braço e um obstáculo.
  margem_ambiente_mm: 20
  # Distância mínima entre partes do próprio braço.
  margem_autocolisao_mm: 10
  # O caminho é verificado em passos tais que nenhum ponto do braço ande mais
  # que isto entre duas verificações (deve ser menor que as margens).
  passo_maximo_mm: 10
  # Medição da mesa (aba Alinhamento da Mesa, só com a célula de carga): a
  # ponteira pode ENCOSTAR na mesa. Nesse movimento, a ferramenta SEM a
  # ponteira é verificada contra a mesa com esta margem (o resto do braço e os
  # outros obstáculos continuam com a margem normal), e a ponteira nunca desce
  # mais que `profundidade_contato_mm` abaixo do tampo da mesa deste modelo
  # (se a mesa real estiver mais baixa que isso, o robô para sem encostar).
  # As duas contas fecham juntas: com a ponteira de 18 mm, 5 mm de margem e
  # 5 mm de folga da medida por pontos, a ponteira pode ir até ~8 mm abaixo
  # do tampo; 6 mm deixa sobra.
  margem_contato_mm: 5
  profundidade_contato_mm: 6
  # Densidade dos pontos na superfície das peças. O erro da medida é somado à
  # margem (lado seguro); menor = mais preciso e mais lento.
  espacamento_pontos_mm: 5

  # O que está preso na ponta (sensores inerciais, suporte...), como uma caixa
  # no frame do flange (Link6): z sai do flange para fora.
  # >>> PREENCHA COM AS MEDIDAS REAIS E MUDE ativa PARA true. <<<
  # Enquanto estiver false, só o flange é verificado — o que estiver preso
  # nele pode bater sem ser detectado.
  #
  # Configurado para o invólucro do sensor inercial S02, medido com paquímetro:
  # 65,36 x 38,13 mm de base e 23,10 mm de altura, centrado no flange. Como o
  # giro do invólucro em torno do flange não foi medido, a base é um quadrado
  # que o cobre em QUALQUER giro (diagonal de 65,36 x 38,13 ≈ 75,7 mm ->
  # 76 x 76 mm). Altura de 23,1 mm saindo do flange (centro em z = 11,55 mm).
  ferramenta:
    ativa: true
    tamanho_mm: [76.0, 76.0, 23.1]
    centro_mm: [0.0, 0.0, 11.55]

  # Obstáculos. Medidas tiradas do laboratório do gêmeo virtual (cópia do
  # research_lab.world do cr10twin), onde o robô fica no centro de uma mesa de
  # 0,60 x 1,10 m a 0,75 m do chão.
  # >>> CONFIRA NO LABORATÓRIO REAL: se a mesa, o chão ou as paredes estiverem
  #     em outro lugar, a verificação protege contra o lugar errado. <<<
  obstaculos:
    # A mesa é tratada como um bloco do tampo até o chão: o modelo do gêmeo
    # só tem o tampo, mas a mesa real tem pés/estrutura embaixo.
    mesa:
      centro_m: [0.0, 0.0, -0.375]
      tamanho_m: [0.60, 1.10, 0.75]
      ignorar_pecas: [base_link]     # a base está parafusada nela
    chao:
      centro_m: [0.0, 0.0, -1.25]
      tamanho_m: [20.0, 20.0, 1.0]
    parede_norte:
      centro_m: [-0.30, 2.50, 0.50]
      tamanho_m: [6.0, 0.12, 2.5]
    parede_oeste:
      centro_m: [-2.80, 0.0, 0.50]
      tamanho_m: [0.12, 5.0, 2.5]
    armario_norte:
      centro_m: [0.20, 2.20, -0.275]
      tamanho_m: [2.40, 0.50, 0.95]
    armario_oeste:
      centro_m: [-2.50, -1.20, 0.25]
      tamanho_m: [0.50, 0.80, 2.00]

# Perfis de FERRAMENTA, escolhidos ao abrir a plataforma (iris com-celula).
# Um perfil SUBSTITUI geometria.ferramenta e controlador.carga_kg /
# centro_massa_mm acima (que continuam valendo quando nenhum é escolhido: o
# sensor inercial S02). Um nome que não existe aqui faz a segurança NÃO
# carregar, e então nenhum movimento é aceito: ferramenta errada no modelo é
# pior que nenhum movimento.
# >>> O PERFIL TEM DE SER O DA FERRAMENTA QUE ESTÁ PARAFUSADA NO ROBÔ REAL. <<<
ferramentas:
  # Célula de carga FA7155 de 6 eixos com a ponteira F, mesma pilha do
  # touch_tool_tcp.urdf do cr10twin (medidas do CAD): flange fixo de alumínio
  # ⌀75 x 6 mm, célula ⌀75 x 36,5 mm (com o conector saindo até 44 mm do
  # centro), acoplador hot-swap ⌀66 e ponteira F 15 x 17 mm, face de contato a
  # 67,7 mm do flange. Como o giro da célula no flange não foi medido, a base é
  # um quadrado que cobre o conector em QUALQUER giro (2 x 44 = 88 mm).
  # Massa: 0,3837 kg no total (célula 300 g de catálogo + peças), centro de
  # massa a 19,5 mm do flange.
  celula_fa7155:
    tamanho_mm: [88.0, 88.0, 67.7]
    centro_mm: [0.0, 0.0, 33.85]
    carga_kg: 0.3837
    centro_massa_mm: [0.0, 0.0, 19.5]
    # Comprimento da ponteira (a parte que encosta na mesa na medição do plano).
    ponteira_mm: 18.0
